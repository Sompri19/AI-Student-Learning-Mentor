<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="AI Student Learning Mentor - personalized study plans, practice quizzes, evidence-based progress and an AI doubt mentor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.1" r="0.58">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glowA)"/>
  <rect width="1280" height="420" fill="url(#glowB)"/>
  <rect width="1280" height="420" fill="url(#glowC)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- glass frame -->
  <rect x="16" y="16" width="1248" height="388" rx="28" fill="#0b1224" fill-opacity="0.34" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="16" y="16" width="1248" height="194" rx="28" fill="url(#shine)"/>

  <!-- logo tile -->
  <g transform="translate(84, 122)">
    <rect width="104" height="104" rx="26" fill="url(#tile)"/>
    <rect width="104" height="104" rx="26" fill="url(#shine)"/>
    <g transform="translate(20, 26)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 L32 6 L60 20 L32 34 Z" fill="#ffffff" fill-opacity="0.95" stroke="none"/>
      <path d="M14 26 V40 C14 45 24 50 32 50 C40 50 50 45 50 40 V26"/>
      <path d="M58 22 V38"/>
    </g>
    <circle cx="82" cy="70" r="7" fill="#0b1224" fill-opacity="0.55"/>
    <circle cx="82" cy="70" r="3.4" fill="#22d3ee"/>
  </g>

  <!-- headline -->
  <text x="220" y="152" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5" fill="#7dd3fc">SDG 4 · QUALITY EDUCATION</text>
  <text x="218" y="216" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">AI Student Learning Mentor</text>
  <rect x="220" y="238" width="300" height="6" rx="3" fill="url(#accent)"/>
  <text x="220" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9fb0cc">Personalized study plans · curriculum practice quizzes · evidence-based progress · AI doubt mentor</text>

  <!-- feature pills -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="220" y="322" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="304" y="347" fill="#dbeafe" text-anchor="middle">📚 Study Plans</text>
    <rect x="402" y="322" width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="466" y="347" fill="#dbeafe" text-anchor="middle">📝 Quizzes</text>
    <rect x="544" y="322" width="134" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="611" y="347" fill="#dbeafe" text-anchor="middle">📊 Progress</text>
    <rect x="692" y="322" width="158" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="771" y="347" fill="#dbeafe" text-anchor="middle">🤖 AI Mentor</text>
  </g>

  <!-- stack label -->
  <g transform="translate(968, 322)">
    <rect width="248" height="40" rx="20" fill="#0b1224" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="24" cy="20" r="5" fill="#22c55e"/>
    <text x="40" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Flask · MySQL · Python 3.10+</text>
  </g>
</svg>
