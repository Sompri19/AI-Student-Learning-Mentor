<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AI Student Learning Mentor logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#halo)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- graduation cap -->
  <g transform="translate(52, 78)">
    <path d="M0 30 L76 0 L152 30 L76 60 Z" fill="#ffffff"/>
    <path d="M28 42 V68 C28 82 52 92 76 92 C100 92 124 82 124 68 V42 L76 61 Z" fill="#ffffff" fill-opacity="0.86"/>
    <path d="M148 34 V74" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="148" cy="82" r="9" fill="#0b1224" fill-opacity="0.5"/>
    <circle cx="148" cy="82" r="4" fill="#22d3ee"/>
  </g>

  <!-- circuit accent -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 196 H84"/>
    <path d="M172 196 H216"/>
  </g>
  <circle cx="90" cy="196" r="5" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="166" cy="196" r="5" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="128" cy="196" r="8" fill="#0b1224" fill-opacity="0.45"/>
  <circle cx="128" cy="196" r="4" fill="#ffffff"/>
</svg>
